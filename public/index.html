<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header p {
            color: #666;
            font-size: 1.2em;
            font-weight: 400;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .status.online {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            box-shadow: 0 4px 15px rgba(21, 87, 36, 0.2);
        }

        .status.online::before {
            background: #28a745;
        }

        .status.offline {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            box-shadow: 0 4px 15px rgba(114, 28, 36, 0.2);
        }

        .status.offline::before {
            background: #dc3545;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-size: 1.8em;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, #667eea, #764ba2) 1;
            position: relative;
        }

        .card h2::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #764ba2, #667eea);
            transition: width 0.3s ease;
        }

        .card:hover h2::after {
            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
            letter-spacing: 0.3px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        .response {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-left: 5px solid #667eea;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            max-height: 450px;
            overflow-y: auto;
            display: none;
            animation: slideIn 0.4s ease-out;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                max-height: 0;
                padding: 0 20px;
            }

            to {
                opacity: 1;
                max-height: 450px;
                padding: 20px;
            }
        }

        .response.show {
            display: block;
        }

        .response pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #2d3748;
        }

        .response.success {
            border-left-color: #28a745;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        }

        .response.error {
            border-left-color: #dc3545;
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
        }

        .quick-btn {
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            border: 2px solid rgba(102, 126, 234, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: linear-gradient(135deg, rgba(209, 236, 241, 0.9) 0%, rgba(174, 214, 241, 0.9) 100%);
            border-left: 5px solid #0c5460;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(12, 84, 96, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .info-box h3 {
            color: #0c5460;
            margin-bottom: 12px;
            font-size: 1.1em;
            font-weight: 700;
        }

        .info-box p {
            margin: 8px 0;
            color: #0a3f4a;
        }

        .info-box code {
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Monaco', monospace;
            font-size: 0.9em;
            color: #0c5460;
            font-weight: 600;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Emoji animations */
        .animated-emoji {
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><span class="animated-emoji">📚</span> Book Review App</h1>
            <p>Test and interact with the API</p>
            <div id="serverStatus" class="status offline">Checking server...</div>
            <div class="info-box">
                <h3>🌐 Access Information</h3>
                <p><strong>API Base URL:</strong> <code id="baseUrl">http://localhost:5001</code></p>
                <p><strong>Your Token:</strong> <span id="currentToken" style="color: #666; font-style: italic;">Not
                        logged in</span></p>
            </div>
        </div>

        <div class="quick-actions">
            <button class="quick-btn" onclick="getAllBooks()">📖 All Books</button>
            <button class="quick-btn" onclick="showSection('auth')">🔐 Login</button>
            <button class="quick-btn" onclick="showSection('review')">✍️ Reviews</button>
            <button class="quick-btn" onclick="clearAllResponses()">🗑️ Clear</button>
        </div>

        <div class="grid">
            <!-- Books Section -->
            <div class="card">
                <h2>📚 Browse Books</h2>
                <div class="form-group">
                    <button onclick="getAllBooks()">Get All Books</button>
                </div>
                <div class="form-group">
                    <label>🔍 Search by ISBN:</label>
                    <input type="text" id="searchIsbn" placeholder="978-0-7432-7356-5">
                    <button onclick="searchByIsbn()" style="margin-top: 10px;">Search</button>
                </div>
                <div class="form-group">
                    <label>✍️ Search by Author:</label>
                    <input type="text" id="searchAuthor" placeholder="George Orwell">
                    <button onclick="searchByAuthor()" style="margin-top: 10px;">Search</button>
                </div>
                <div class="form-group">
                    <label>📖 Search by Title:</label>
                    <input type="text" id="searchTitle" placeholder="1984">
                    <button onclick="searchByTitle()" style="margin-top: 10px;">Search</button>
                </div>
                <div id="booksResponse" class="response"></div>
            </div>

            <!-- Authentication Section -->
            <div class="card" id="auth">
                <h2>🔐 Authentication</h2>
                <div class="form-group">
                    <label>👤 Username:</label>
                    <input type="text" id="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>🔒 Password:</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label>📧 Email (for registration):</label>
                    <input type="email" id="email" placeholder="user@example.com">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <button onclick="register()">Register</button>
                    <button onclick="login()">Login</button>
                </div>
                <div id="authResponse" class="response"></div>
            </div>

            <!-- Reviews Section -->
            <div class="card" id="review">
                <h2>✍️ Manage Reviews</h2>
                <div class="form-group">
                    <label>📕 Book ISBN:</label>
                    <input type="text" id="reviewIsbn" placeholder="978-0-7432-7356-5">
                </div>
                <div class="form-group">
                    <button onclick="getReviews()" style="margin-bottom: 10px;">Get Reviews</button>
                </div>
                <div class="form-group">
                    <label>⭐ Rating (1-5):</label>
                    <select id="rating">
                        <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                        <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                        <option value="3">⭐⭐⭐ (3 - Good)</option>
                        <option value="2">⭐⭐ (2 - Fair)</option>
                        <option value="1">⭐ (1 - Poor)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>💬 Comment:</label>
                    <textarea id="comment" placeholder="Write your review..."></textarea>
                </div>
                <button onclick="addReview()">Add/Update Review</button>
                <div id="reviewResponse" class="response"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:5001'
            : `http://${window.location.hostname}:5001`;

        document.getElementById('baseUrl').textContent = API_BASE;
        let authToken = localStorage.getItem('authToken') || '';

        if (authToken) {
            document.getElementById('currentToken').textContent = authToken.substring(0, 20) + '...';
            document.getElementById('currentToken').style.color = '#28a745';
            document.getElementById('currentToken').style.fontStyle = 'normal';
            document.getElementById('currentToken').style.fontWeight = '600';
        }

        // Check server status
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/`);
                if (response.ok) {
                    document.getElementById('serverStatus').classList.remove('offline');
                    document.getElementById('serverStatus').classList.add('online');
                    document.getElementById('serverStatus').textContent = 'Server Online';
                }
            } catch (error) {
                document.getElementById('serverStatus').classList.remove('online');
                document.getElementById('serverStatus').classList.add('offline');
                document.getElementById('serverStatus').textContent = 'Server Offline';
            }
        }

        checkServerStatus();
        setInterval(checkServerStatus, 5000);

        function showSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearAllResponses() {
            document.querySelectorAll('.response').forEach(el => {
                el.classList.remove('show', 'success', 'error');
                el.innerHTML = '';
            });
        }

        function displayResponse(elementId, data, success = true) {
            const element = document.getElementById(elementId);
            element.classList.add('show');
            element.classList.remove('success', 'error');
            element.classList.add(success ? 'success' : 'error');

            if (typeof data === 'object') {
                element.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } else {
                element.innerHTML = `<pre>${data}</pre>`;
            }
        }

        async function getAllBooks() {
            try {
                const response = await fetch(`${API_BASE}/books`);
                const data = await response.json();
                displayResponse('booksResponse', data, response.ok);
            } catch (error) {
                displayResponse('booksResponse', { error: error.message }, false);
            }
        }

        async function searchByIsbn() {
            const isbn = document.getElementById('searchIsbn').value;
            if (!isbn) {
                alert('Please enter an ISBN');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/books/isbn/${isbn}`);
                const data = await response.json();
                displayResponse('booksResponse', data, response.ok);
            } catch (error) {
                displayResponse('booksResponse', { error: error.message }, false);
            }
        }

        async function searchByAuthor() {
            const author = document.getElementById('searchAuthor').value;
            if (!author) {
                alert('Please enter an author name');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/books/author/${encodeURIComponent(author)}`);
                const data = await response.json();
                displayResponse('booksResponse', data, response.ok);
            } catch (error) {
                displayResponse('booksResponse', { error: error.message }, false);
            }
        }

        async function searchByTitle() {
            const title = document.getElementById('searchTitle').value;
            if (!title) {
                alert('Please enter a title');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/books/title/${encodeURIComponent(title)}`);
                const data = await response.json();
                displayResponse('booksResponse', data, response.ok);
            } catch (error) {
                displayResponse('booksResponse', { error: error.message }, false);
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;

            if (!username || !password || !email) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });
                const data = await response.json();
                displayResponse('authResponse', data, response.ok);

                if (response.ok) {
                    alert('✅ Registration successful! You can now login.');
                }
            } catch (error) {
                displayResponse('authResponse', { error: error.message }, false);
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Please enter username and password');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                displayResponse('authResponse', data, response.ok);

                if (response.ok && data.data.token) {
                    authToken = data.data.token;
                    localStorage.setItem('authToken', authToken);
                    document.getElementById('currentToken').textContent = authToken.substring(0, 20) + '...';
                    document.getElementById('currentToken').style.color = '#28a745';
                    document.getElementById('currentToken').style.fontStyle = 'normal';
                    document.getElementById('currentToken').style.fontWeight = '600';
                    alert('✅ Login successful! Token saved.');
                }
            } catch (error) {
                displayResponse('authResponse', { error: error.message }, false);
            }
        }

        async function getReviews() {
            const isbn = document.getElementById('reviewIsbn').value;
            if (!isbn) {
                alert('Please enter a book ISBN');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/books/${isbn}/reviews`);
                const data = await response.json();
                displayResponse('reviewResponse', data, response.ok);
            } catch (error) {
                displayResponse('reviewResponse', { error: error.message }, false);
            }
        }

        async function addReview() {
            if (!authToken) {
                alert('⚠️ Please login first to add a review!');
                return;
            }

            const isbn = document.getElementById('reviewIsbn').value;
            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('comment').value;

            if (!isbn) {
                alert('Please enter a book ISBN');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/books/${isbn}/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ rating: parseInt(rating), comment })
                });
                const data = await response.json();
                displayResponse('reviewResponse', data, response.ok);

                if (response.ok) {
                    alert('✅ Review added/updated successfully!');
                }
            } catch (error) {
                displayResponse('reviewResponse', { error: error.message }, false);
            }
        }
    </script>
</body>

</html>
